<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM2 Manager Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header-top">
        <div style="font-weight:700; font-size:1.2rem;"><i class="fa-solid fa-server"></i> PM2 Monitor</div>
        <div id="authArea"></div>
    </div>

    <div class="server-pill">
        <div id="currentDate" class="date-text">Loading...</div>
        <div style="font-size: 12px; font-weight: 700; color: var(--danger);"><i class="fa-solid fa-circle-dot"></i> LIVE</div>
    </div>

    <div class="global-grid">
        <div class="monitor-card">
            <span class="mon-label">CPU Usage</span><span class="mon-val" id="cpuVal">0%</span>
            <div class="progress-bg"><div class="progress-fill" id="cpuBar" style="background: var(--danger)"></div></div>
            <div style="height:40px;"><canvas id="cpuMiniChart"></canvas></div>
        </div>
        <div class="monitor-card">
            <span class="mon-label">RAM Usage</span><span class="mon-val" id="memVal">0%</span>
            <div class="progress-bg"><div class="progress-fill" id="memBar" style="background: var(--success)"></div></div>
            <div style="height:40px;"><canvas id="memMiniChart"></canvas></div>
            <div id="memDetail" style="font-size: 9px; color: #94a3b8; font-weight: 700;">0 / 0 GB</div>
        </div>
        <div class="monitor-card">
            <span class="mon-label">Disk Space</span><span class="mon-val" id="diskVal">0%</span>
            <div class="progress-bg"><div class="progress-fill" id="diskBar" style="background: var(--warning)"></div></div>
            <div id="diskDetail" style="font-size: 9px; color: #94a3b8; font-weight: 700;">0/0 GB</div>
        </div>
    </div>

    <div id="toolbar" class="toolbar" hidden>
        <select id="userFilter" aria-label="Filter by Linux user"><option value="">All users</option></select>
        <button id="manageTargets" class="btn btn-info" hidden>Manage targets</button>
    </div>
    <div id="pageError" class="notice error" role="alert" hidden></div>
    <div id="targetStatus" aria-live="polite"></div>
    <div id="app-list"></div>

    <div class="modal" id="targetsModal">
        <div class="modal-box target-dialog">
            <h3>Manage targets</h3>
            <div id="targetsList"></div>
            <form id="targetForm" class="target-form">
                <label>Linux username<input id="targetUser" required autocomplete="off" maxlength="64" placeholder="appuser"></label>
                <label>Dashboard host / URL<input id="targetHost" type="url" required value="http://127.0.0.1"></label>
                <label>Port<input id="targetPort" type="number" required min="1" max="65535" value="8888"></label>
                <label>Dashboard admin password<input id="targetPassword" type="password" autocomplete="new-password" maxlength="1024" placeholder="Optional for read-only access"></label>
                <div id="targetMessage" role="status"></div>
                <div class="btn-group">
                    <button id="saveTarget" type="submit" class="btn btn-start">Check & add</button>
                    <button id="resetTarget" type="button" class="btn btn-restart">New target</button>
                    <button id="closeTargets" type="button" class="btn btn-restart">Close</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="loginModal">
        <div class="modal-box login-box">
            <i class="fa-solid fa-shield-halved" style="font-size: 40px; color: var(--primary);"></i>
            <h3 style="margin-top: 15px;">Admin Login</h3>
            <input type="password" id="adminPass" aria-label="Dashboard admin password" autocomplete="current-password" placeholder="Password Admin">
            <button id="submitLogin" class="btn btn-info" style="width: 100%;">Login</button>
            <button id="closeLogin" style="background:none; border:none; color:#aaa; font-size:11px; margin-top:10px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <div class="modal" id="infoModal">
        <div class="modal-box">
            <h3 id="detTitle" style="margin-bottom:15px">Detail</h3>
            <div style="height:180px;"><canvas id="detChart"></canvas></div>
            <div class="console" id="detLogOut">...</div>
            <div id="modalActionArea" style="display:flex; gap:10px; margin-top:20px;"></div>
        </div>
    </div>

    <script src="/app.js" defer></script>
</body>
</html>
