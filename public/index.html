<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM2 Manager Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --primary: #4776E6; --text: #1e293b; --border: #e2e8f0; --danger: #ff7675; --success: #00b894; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); padding: 20px; padding-bottom: 80px; }

        /* Layout */
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .server-pill { background: #fff; border: 1px solid var(--border); border-radius: 15px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .global-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .monitor-card { background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 15px; position: relative; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: hidden; }
        .mon-label { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; }
        .mon-val { font-size: 1.2rem; font-weight: 700; margin: 8px 0; display: block; }

        /* Components */
        .progress-bg { background: #f1f5f9; height: 8px; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
        .progress-fill { height: 100%; width: 0%; transition: 0.5s; border-radius: 10px; }
        .app-card { background: #fff; border-radius: 20px; padding: 20px; border: 1px solid var(--border); margin-bottom: 15px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .app-stats-bar { background: #f8fafc; border-radius: 12px; padding: 10px 15px; display: flex; gap: 15px; font-size: 12px; color: #64748b; font-weight: 600; margin-bottom: 15px; }
        .online-badge { font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 8px; text-transform: uppercase; }

        /* Buttons */
        .btn-group { display: flex; gap: 8px; }
        .btn { flex: 1; border: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-stop { background: var(--danger); color: white; }
        .btn-start { background: var(--success); color: white; }
        .btn-restart { background: #dfe6e9; color: #475569; }
        .btn-info { background: #74b9ff; color: white; }
        .btn-disabled { background: #f1f5f9; color: #cbd5e1; cursor: not-allowed; }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-box { background: #fff; border-radius: 25px; padding: 25px; width: 100%; max-width: 500px; position: relative; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .console { background: #1e293b; color: #10b981; padding: 15px; border-radius: 15px; height: 180px; overflow-y: auto; font-family: monospace; font-size: 11px; margin-top: 15px; white-space: pre-wrap; border: 1px solid #334155; }
        
        .login-box { width: 320px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; margin: 15px 0; outline: none; text-align: center; }
    </style>
</head>
<body>

    <div class="header-top">
        <div style="font-weight:700; font-size:1.2rem;"><i class="fa-solid fa-server"></i> PM2 Monitor</div>
        <div id="authArea"></div>
    </div>

    <div class="server-pill">
        <div id="currentDate" class="date-text">Loading...</div>
        <div style="font-size: 12px; font-weight: 700; color: var(--danger);"><i class="fa-solid fa-circle-dot"></i> LIVE</div>
    </div>

    <div class="global-grid">
        <div class="monitor-card">
            <span class="mon-label">CPU Load</span><span class="mon-val" id="cpuVal">0%</span>
            <div class="progress-bg"><div class="progress-fill" id="cpuBar" style="background: var(--danger)"></div></div>
            <div style="height:40px;"><canvas id="cpuMiniChart"></canvas></div>
        </div>
        <div class="monitor-card">
            <span class="mon-label">RAM Usage</span><span class="mon-val" id="memVal">0%</span>
            <div class="progress-bg"><div class="progress-fill" id="memBar" style="background: var(--success)"></div></div>
            <div style="height:40px;"><canvas id="memMiniChart"></canvas></div>
        </div>
        <div class="monitor-card">
            <span class="mon-label">Disk Space</span><span class="mon-val" id="diskVal">0%</span>
            <div class="progress-bg"><div class="progress-fill" id="diskBar" style="background: var(--warning)"></div></div>
            <div id="diskDetail" style="font-size: 9px; color: #94a3b8; font-weight: 700;">0/0 GB</div>
        </div>
    </div>

    <div id="app-list"></div>

    <div class="modal" id="loginModal">
        <div class="modal-box login-box" onclick="event.stopPropagation()">
            <i class="fa-solid fa-shield-halved" style="font-size: 40px; color: var(--primary);"></i>
            <h3 style="margin-top: 15px;">Admin Login</h3>
            <input type="password" id="adminPass" placeholder="Password Admin">
            <button onclick="submitLogin()" class="btn btn-info" style="width: 100%;">Masuk</button>
            <button onclick="closeLogin()" style="background:none; border:none; color:#aaa; font-size:11px; margin-top:10px; cursor:pointer;">Batal</button>
        </div>
    </div>

    <div class="modal" id="infoModal" onclick="closeInfo()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h3 id="detTitle" style="margin-bottom:15px">Detail</h3>
            <div style="height:180px;"><canvas id="detChart"></canvas></div>
            <div class="console" id="detLogOut">...</div>
            <div id="modalActionArea" style="display:flex; gap:10px; margin-top:20px;"></div>
        </div>
    </div>

    <script>
        let isAdmin = false; let activeId = null; let detChart = null; 
        let hist = { cpu: [], mem: [] }; let appHist = {}; let miniCharts = {};

        function initMiniCharts() {
            const opt = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false, beginAtZero: true } }, elements: { line: { tension: 0.4 }, point: { radius: 0 } } };
            miniCharts.cpu = new Chart(document.getElementById('cpuMiniChart'), { type: 'line', data: { labels: Array(10).fill(''), datasets: [{ data: [], borderColor: '#ff7675', borderWidth: 2, fill: false }] }, options: opt });
            miniCharts.mem = new Chart(document.getElementById('memMiniChart'), { type: 'line', data: { labels: Array(10).fill(''), datasets: [{ data: [], borderColor: '#00b894', borderWidth: 2, fill: false }] }, options: opt });
        }

        async function fetchData() {
            try {
                const r = await fetch('/api/status'); const data = await r.json();
                isAdmin = data.isAdmin;
                
                document.getElementById('authArea').innerHTML = isAdmin ? 
                    `<button onclick="location.href='/auth/logout'" style="background:var(--danger); color:white; border:none; width:40px; height:40px; border-radius:12px; cursor:pointer;"><i class="fa-solid fa-power-off"></i></button>` : 
                    `<div style="font-size:11px; font-weight:700; color:#94a3b8; cursor:pointer;" onclick="showLogin()"><i class="fa-solid fa-lock"></i> Login</div>`;

                document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
                
                let ramP = ((data.serverStats.totalMem - data.serverStats.freeMem) / data.serverStats.totalMem * 100).toFixed(1);
                let cpuP = (data.serverStats.load * 10).toFixed(1);

                document.getElementById('cpuVal').innerText = cpuP + "%"; document.getElementById('cpuBar').style.width = cpuP + "%";
                document.getElementById('memVal').innerText = ramP + "%"; document.getElementById('memBar').style.width = ramP + "%";
                document.getElementById('diskVal').innerText = data.serverStats.disk.percent + "%"; document.getElementById('diskBar').style.width = data.serverStats.disk.percent + "%";
                document.getElementById('diskDetail').innerText = `${data.serverStats.disk.used} / ${data.serverStats.disk.total} GB`;

                hist.cpu.push(cpuP); hist.mem.push(ramP);
                if(hist.cpu.length > 10) { hist.cpu.shift(); hist.mem.shift(); }
                miniCharts.cpu.data.datasets[0].data = hist.cpu; miniCharts.cpu.update();
                miniCharts.mem.data.datasets[0].data = hist.mem; miniCharts.mem.update();

                data.processes.forEach(p => {
                    if(!appHist[p.id]) appHist[p.id] = { r: [], c: [] };
                    appHist[p.id].r.push(parseFloat(p.memory)); appHist[p.id].c.push(p.cpu);
                    if(appHist[p.id].r.length > 20) { appHist[p.id].r.shift(); appHist[p.id].c.shift(); }
                });

                renderList(data.processes);
                if(activeId !== null) updateDetChart();
            } catch(e) {}
        }

        function renderList(apps) {
            const container = document.getElementById('app-list'); container.innerHTML = '';
            apps.forEach(p => {
                const online = p.status === 'online';
                const locked = p.name === 'pm2-dashboard';
                const div = document.createElement('div'); div.className = 'app-card';
                
                let btns = `<button class="btn btn-info" style="flex:1" onclick="openInfo(${p.id}, '${p.name}')"><i class="fa-solid fa-chart-line"></i> View Logs</button>`;
                if (isAdmin) {
                    btns = `
                        ${locked ? `<button class="btn btn-disabled"><i class="fa-solid fa-lock"></i> Locked</button>` : `<button class="btn ${online?'btn-stop':'btn-start'}" onclick="doAction('${online?'stop':'restart'}', ${p.id})"><i class="fa-solid fa-${online?'stop':'play'}"></i> ${online?'Stop':'Start'}</button>`}
                        <button class="btn btn-restart" onclick="doAction('restart', ${p.id})"><i class="fa-solid fa-rotate"></i> Restart</button>
                        <button class="btn btn-info" onclick="openInfo(${p.id}, '${p.name}')"><i class="fa-solid fa-chart-line"></i> Info</button>
                    `;
                }

                div.innerHTML = `
                    <div class="card-header"><span style="font-weight:700;">${p.name}</span><span class="online-badge" style="background:${online?'#e8f5e9':'#ffebee'}; color:${online?'#2e7d32':'#c62828'}">${p.status}</span></div>
                    <div class="app-stats-bar">
                        <span><i class="fa-solid fa-memory"></i> ${p.memory} MB</span><span><i class="fa-solid fa-microchip"></i> ${p.cpu}%</span>
                    </div>
                    <div class="btn-group">${btns}</div>`;
                container.appendChild(div);
            });
        }

        function showLogin() { document.getElementById('loginModal').style.display='flex'; }
        function closeLogin() { document.getElementById('loginModal').style.display='none'; }
        async function submitLogin() {
            const r = await fetch('/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:document.getElementById('adminPass').value}) });
            if(r.ok) { closeLogin(); fetchData(); } else alert("Password Salah!");
        }

        function openInfo(id, name) {
            activeId = id; document.getElementById('detTitle').innerText = name;
            document.getElementById('infoModal').style.display = 'flex';
            const area = document.getElementById('modalActionArea');
            if(isAdmin) {
                const locked = name === 'pm2-dashboard';
                area.innerHTML = `<button onclick="renameApp()" class="btn btn-restart" style="flex:1">Rename</button> ${locked?'':`<button onclick="deleteApp()" class="btn btn-stop" style="flex:1">Remove</button>`} <button onclick="closeInfo()" class="btn" style="background:#eee; flex:1">Close</button>`;
            } else area.innerHTML = `<button onclick="closeInfo()" class="btn" style="background:#eee; width:100%">Close</button>`;
            initDetChart(); fetchLogs(id);
        }

        function initDetChart() {
            const ctx = document.getElementById('detChart').getContext('2d');
            if(detChart) detChart.destroy();
            detChart = new Chart(ctx, { type:'line', data:{labels:Array(20).fill(''), datasets:[{label:'RAM', data:[], borderColor:'#4776E6', backgroundColor:'rgba(71,118,230,0.1)', fill:true, tension:0.4, pointRadius:0},{label:'CPU', data:[], borderColor:'#ff7675', tension:0.4, pointRadius:0}]}, options:{responsive:true, maintainAspectRatio:false, animation:false, scales:{x:{display:false}, y:{beginAtZero:true}}} });
        }

        function updateDetChart() { if(!appHist[activeId] || !detChart) return; detChart.data.datasets[0].data = appHist[activeId].r; detChart.data.datasets[1].data = appHist[activeId].c; detChart.update(); }
        async function fetchLogs(id) { if(activeId !== id) return; const r = await fetch(`/api/logs/${id}`); const d = await r.json(); const box = document.getElementById('detLogOut'); box.innerText = d.out.replace(/[\u001b\u009b][[()#;?]*(?:[0-9]{1,4}(?:;[0-9]{0,4})*)?[0-9A-ORZcf-nqry=><]/g, ''); box.scrollTop = box.scrollHeight; setTimeout(()=>fetchLogs(id), 3000); }
        function closeInfo() { document.getElementById('infoModal').style.display='none'; activeId=null; }
        async function doAction(a, id) { await fetch(`/api/${a}/${id}`, {method:'POST'}); fetchData(); }
        function formatUptime(ms) { if(!ms) return '-'; const s = Math.floor((Date.now()-ms)/1000); return s<60 ? s+'s' : s<3600 ? Math.floor(s/60)+'m' : Math.floor(s/3600)+'h'; }

        initMiniCharts(); setInterval(fetchData, 2000); fetchData();
    </script>
</body>
</html>
